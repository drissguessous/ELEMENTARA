<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#120c24" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Elementara</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #120c24; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
      #game { position: fixed; inset: 0; }
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #120c24; color: #ffe9b0;
        font: 600 20px/1.4 system-ui, sans-serif; align-items: center; justify-content: center; text-align: center; padding: 24px; }
      @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
      #loading { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; pointer-events: none;
        background: radial-gradient(circle at 50% 50%, #2a1846 0%, #120c24 70%); color: #ffd98a; font: 700 34px Georgia, serif;
        letter-spacing: 6px; opacity: 0; transition: opacity .25s; }
      #loading.show { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="loading" class="show">ELEMENTARA</div>
    <div id="rotate">↻<br />Tourne ton téléphone pour jouer<br /><small>Turn your phone sideways to play</small></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
