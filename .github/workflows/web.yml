name: Web build & play online

# Type-checks, builds and publishes the playable web version on GitHub Pages
# (https://drissguessous.github.io/ELEMENTARA/) — open it on any phone to test.
on:
  push:
    branches: [main]
    paths-ignore: ['models/raw/**', 'tools/pipeline/**', 'docs/**', '*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        with: { enablement: true }
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with: { path: dist }

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
